<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{background:radial-gradient(ellipse at 50% 45%,#fff 0%,#e5effa 45%,#a6cde8 100%)}canvas{display:block;position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body><canvas id="film" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import {FontLoader} from 'three/addons/loaders/FontLoader.js';
import {TextGeometry} from 'three/addons/geometries/TextGeometry.js';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1080,1920);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(34,1080/1920,.1,100);camera.position.set(0,0,11);
scene.add(new THREE.HemisphereLight(0xffffff,0x8ca6cd,3));
for(const [x,y,z,power,color] of [[-4,5,6,7,0xffffff],[4,1,3,5,0xffaac8],[-2,-3,2,4,0xffffff]]){const l=new THREE.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l)}
const group=new THREE.Group();scene.add(group);
const material=new THREE.MeshPhysicalMaterial({color:0xee0055,metalness:.45,roughness:.2,clearcoat:1,clearcoatRoughness:.08});
const side=new THREE.MeshPhysicalMaterial({color:0xb40042,metalness:.6,roughness:.25,clearcoat:1});
const ribbon=new THREE.Mesh(new THREE.TorusGeometry(1.75,.045,10,140,Math.PI*1.65),new THREE.MeshPhysicalMaterial({color:0xffbedb,metalness:.45,roughness:.18,transparent:true,opacity:.8}));scene.add(ribbon);
group.scale.set(.72,.95,1);
const font=await new FontLoader().loadAsync('/three/examples/fonts/helvetiker_regular.typeface.json');
let previousRank=0,number;
const film=document.querySelector('#film'),ctx=film.getContext('2d');
window.counterFrame=async(model,rank,frame)=>{
 const p=frame/(model==='film'?24:30);
 film.style.display=model==='film'?'block':'none';renderer.domElement.style.display=model==='pink3d'?'block':'none';
 if(model==='pink3d'){
  if(previousRank!==rank){if(number){group.remove(number);number.geometry.dispose()}const geometry=new TextGeometry(String(rank),{font,size:2.1,depth:.3,curveSegments:12,bevelEnabled:true,bevelThickness:.045,bevelSize:.035,bevelSegments:4});geometry.center();number=new THREE.Mesh(geometry,[material,side]);const box=new THREE.Box3().setFromObject(number);const w=box.max.x-box.min.x;number.scale.setScalar(Math.min(1,3.55/w));group.add(number);previousRank=rank}
  const entrance=Math.max(0,1-frame/8),exit=Math.max(0,(frame-23)/7);
  group.rotation.set(.03*Math.sin(p*Math.PI*2),-1.5*entrance+1.5*exit,.01*Math.sin(p*6));
  group.position.y=.08*Math.sin(p*Math.PI*2);ribbon.rotation.set(1.1,.4+p*Math.PI,.4+p*1.5);renderer.render(scene,camera);
 }else{
  const g=ctx.createLinearGradient(0,0,1080,1920);g.addColorStop(0,'#e2e2e2');g.addColorStop(.5,'#777');g.addColorStop(1,'#dedede');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920);
  ctx.fillStyle='#858585';ctx.fillRect(0,420,1080,1080);
  ctx.beginPath();ctx.moveTo(540,960);ctx.arc(540,960,800,-Math.PI/2,-Math.PI/2+p*Math.PI*2);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(540,420);ctx.lineTo(540,1500);ctx.moveTo(0,960);ctx.lineTo(1080,960);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=12;ctx.beginPath();ctx.arc(540,960,503,0,Math.PI*2);ctx.stroke();
  ctx.font=`bold ${rank===10?620:760}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(String(rank),540,996);
 }
};
await window.counterFrame('pink3d',10,15);window.counterReady=true;
</script></body></html>

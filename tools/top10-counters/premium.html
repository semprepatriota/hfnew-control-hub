<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: radial-gradient(ellipse at 48% 46%, #ffffff 0%, #e8f0f8 42%, #a8cce3 100%); }
    canvas { display: block; width: 1080px; height: 1920px; }
  </style>
  <script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1080 / 1920, .1, 100);
camera.position.set(0, 0, 11);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .03).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x7598bd, 1.3));
for (const [x, y, z, power, color] of [[-4,5,6,4.2,0xffffff], [4,1,3,2,0xffd8e8], [-2,-3,2,2.4,0xe7f3ff]]) {
  const light = new THREE.DirectionalLight(color, power);
  light.position.set(x, y, z);
  scene.add(light);
}

const group = new THREE.Group();
scene.add(group);
const front = new THREE.MeshPhysicalMaterial({
  color: 0xe00057, metalness: .72, roughness: .15,
  clearcoat: 1, clearcoatRoughness: .055, envMapIntensity: 1.8,
});
const side = new THREE.MeshPhysicalMaterial({
  color: 0x9e003c, metalness: .72, roughness: .19,
  clearcoat: 1, envMapIntensity: 1.6,
});

function silkRibbon(offset, width) {
  const positions = [], uv = [], indices = [], segments = 180;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const angle = t * Math.PI * 2 + offset;
    const half = width * Math.pow(Math.sin(Math.PI * t), .6) / 2;
    const x = Math.sin(angle) * 1.42;
    const y = (t - .5) * 3.7;
    const z = Math.cos(angle) * .68;
    positions.push(x, y - half, z, x, y + half, z);
    uv.push(t, 0, t, 1);
    if (i < segments) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xffe9f3, metalness: .28, roughness: .16, transparent: true,
    opacity: .7, side: THREE.DoubleSide, clearcoat: 1, envMapIntensity: 1.7, depthWrite: false,
  });
  return new THREE.Mesh(geometry, material);
}
const ribbon = new THREE.Group();
ribbon.add(silkRibbon(.25, .16), silkRibbon(.56, .035));
scene.add(ribbon);

const font = await new FontLoader().loadAsync('/three/examples/fonts/helvetiker_bold.typeface.json');
let number, previousRank;
window.counterFrame = async (model, rank, frame) => {
  if (model !== 'pink3d' || ![1, 2].includes(rank)) throw new Error('Premium renderer supports only pink counters 1 and 2');
  if (previousRank !== rank) {
    if (number) { group.remove(number); number.geometry.dispose(); }
    const geometry = new TextGeometry(String(rank), {
      font, size: 3.2, depth: .5, curveSegments: 24,
      bevelEnabled: true, bevelThickness: .075, bevelSize: .065, bevelSegments: 7,
    });
    geometry.center();
    number = new THREE.Mesh(geometry, [front, side]);
    const size = new THREE.Box3().setFromObject(number).getSize(new THREE.Vector3());
    number.scale.setScalar(Math.min(2.9 / size.y, 2.4 / size.x));
    group.add(number);
    previousRank = rank;
  }
  const p = frame / 30;
  const entrance = Math.pow(Math.max(0, 1 - frame / 10), 3);
  const exit = Math.pow(Math.max(0, (frame - 25) / 5), 2);
  group.rotation.set(.025 * Math.sin(p * Math.PI * 2), -1.2 * entrance + .8 * exit + .12 * Math.sin(p * Math.PI * 2 - .5), .018 * Math.sin(p * 6));
  group.scale.setScalar(1 - .1 * entrance - .05 * exit);
  group.position.y = .04 * Math.sin(p * Math.PI * 2);
  ribbon.rotation.set(0, .2 + p * Math.PI * 1.45, .12);
  renderer.render(scene, camera);
};
await window.counterFrame('pink3d', 2, 15);
window.counterReady = true;
</script>
</body>
</html>

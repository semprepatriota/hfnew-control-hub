# Configuração Nginx para psi.hfnew.com.br
# Localização de produção: /etc/nginx/sites-available/psi.hfnew.com.br
# Depois fazer: sudo ln -s /etc/nginx/sites-available/psi.hfnew.com.br /etc/nginx/sites-enabled/

# Redirecionar HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name psi.hfnew.com.br;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionar tudo para HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Aplicação React SPA
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psi.hfnew.com.br;

    # ===== SSL Configuration =====
    ssl_certificate /etc/letsencrypt/live/psi.hfnew.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psi.hfnew.com.br/privkey.pem;

    # Protocolos SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;

    # Session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ===== Security Headers =====
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ===== Logging =====
    access_log /var/log/nginx/psi-frontend-access.log combined;
    error_log /var/log/nginx/psi-frontend-error.log warn;

    # ===== Root Directory =====
    root /opt/hfnew-psi/frontend/dist;
    index index.html index.htm;

    # ===== API de autenticacao =====
    # O backend escuta somente localhost; o dashboard nao participa desta sessao.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_intercept_errors off;
    }

    # ===== SPA Routing =====
    # Redirecionar todas as rotas para index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== Static Assets Cache =====
    # Cache agressivo para assets com hash (JS, CSS, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # ===== HTML Cache Policy =====
    # Sem cache para HTML (sempre buscar versão nova)
    location ~ ^/(index\.html|manifest\.json|service-worker\.js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        expires 0;
    }

    # ===== Gzip Compression =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript application/xml;
    gzip_disable "msie6";

    # ===== Security - Block Hidden Files =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== Security - Block Sensitive Directories =====
    location ~ ^/(node_modules|src|dist|\.env|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== Security - Block Common Admin Paths =====
    location ~ ^/(admin|wp-admin|wp-login|administrator) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== Security - Deny Access to Config Files =====
    location ~ \.(env|cfg|conf|json|yml|yaml|xml|sql|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== 404 Handler =====
    error_page 404 /index.html;
}

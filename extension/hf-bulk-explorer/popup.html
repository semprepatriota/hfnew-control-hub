<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HF Bulk Explorer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="logo">HF</div>
        <div><h1>Bulk Explorer</h1><p>Extensão do HF New Control Hub</p></div>
      </header>

      <div class="status ok">Conexão local protegida pelo Chrome</div>

      <label for="scanLimit">Quantidade de vídeos</label>
      <select id="scanLimit">
        <option value="10">10 vídeos</option>
        <option value="25" selected>25 vídeos</option>
        <option value="50">50 vídeos</option>
        <option value="75">75 vídeos</option>
        <option value="100">100 vídeos</option>
      </select>

      <section>
        <div class="result-line"><span>Conteúdos encontrados</span><strong id="resultCount">0</strong></div>
        <div id="pageName" class="page-name">Abra um perfil ou página suportada.</div>
      </section>

      <div class="actions">
        <button id="scanPage" class="secondary">Escanear página</button>
        <button id="sendItems" class="primary" disabled>Enviar ao painel</button>
      </div>
      <div id="message" class="message" aria-live="polite"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
